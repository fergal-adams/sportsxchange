hero_intro: "It's simple — join our WhatsApp group, post what you have or find what you need, and arrange collection at a local pick-up point."

steps:
  - num: 1
    title: Join the group
    description: "Scan the QR code on this site or tap the join button to request access to our WhatsApp group. We'll add you to the community."
  - num: 2
    title: Post items
    description: "Take a photo of the item and post it in the group with a few details — what it is, the size, condition, and where you can pick up or collect. For example: \"Age 7-9 football jersey, excellent condition. Can collect from SuperValu Ballybunion.\""
  - num: 3
    title: Claim and collect
    description: "See something you or your child needs? Reply to the post and arrange collection between yourselves at a suitable location. First to reply secures the item."

collection_points:
  - name: SuperValu
    address: "Ballybunion,\nNorth Kerry"
    logo: "/assets/logo-supervalu.png"
  - name: Beale GAA Club
    address: "Ballybunion,\nNorth Kerry"
    logo: "/assets/logo-beale-gaa.png"
  - name: Ballybunion Community Centre
    address: "Ballybunion,\nNorth Kerry"
    logo: "/assets/logo-ballybunion-cc.png"

keep_circle_heading: "Keep the circle going"
keep_circle_text: "When you pick up an item, use it for as long as you need. When it's outgrown or no longer needed, clean it up and post it back on the group for someone else. That's how we keep good gear going — extending the life of every item and making sure nothing ends up in a cupboard or out of use, when it still has life left in it."

faqs:
  - q: What can I post?
    a: "Any sports gear in good, clean condition — if it's used for sport or exercise and it's still in good nick, it's welcome."
  - q: What shouldn't be posted?
    a: "Anything damaged, stained, or heavily worn. Non-sports items. Items with missing parts."
  - q: Can I join if I have nothing to give yet?
    a: "Absolutely. Take what you need. When you have something to pass on, post it."
  - q: How do I claim an item?
    a: "Reply to the post in the WhatsApp group and arrange collection between yourselves. First to reply secures the item."
  - q: Where do I pick up or collect items?
    a: "We have pick-up points at SuperValu Ballybunion, Beale GAA Club, and Ballybunion Community Centre. Please use these public locations rather than sharing home addresses."
  - q: What if the size isn't right?
    a: "No problem — post it back on the group for someone else, or return it to the original poster."
  - q: How long are items available?
    a: "Until someone claims them. If unclaimed after a month, the person who posted can remove them."
  - q: Is this just for children's gear?
    a: "No — adults are welcome too. If you've got gear you no longer use, someone else probably needs it."
  - q: Do I have to swap? Can I just give stuff away?
    a: "Yes! There's no obligation to take something in return. If you just want to pass things on, that's excellent."
  - q: Who manages this?
    a: "SportsXChange is run by North Kerry Environmental Forum with support from the community."
  - q: I have a question that isn't answered here.
    a: "Get in touch at northkerryenvironmentalforum@gmail.com and we'll help you out."
