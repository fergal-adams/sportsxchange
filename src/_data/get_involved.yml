join_text: "Scan the QR code or tap the button below to join our WhatsApp group. Post what you have, browse what's available, and connect with other families and sports people in North Kerry."

clubs_text: "Got old team kits, spare equipment, or gear gathering dust in the clubhouse? We'd love to help you get it back into use. You can bulk-donate items, promote Sportswear X-Change to your members, or set up a collection point at your club. Get in touch at [email address]."

businesses_text: "Interested in becoming a pick-up point? If you're a supermarket, community centre, sports facility, or local business, hosting a SportsXChange collection point is a simple way to support your community and show your commitment to sustainability. Get in touch at [email address]."

spread_word: "Know someone who could use this? Share the link to this website, or download our flyer and pass it on to your club, school, or community group."

contact_note: "Questions, ideas, or just want to say hello? Get in touch. Email: [email] Phone: [phone] Follow NKEF on Facebook for sustainability updates and Sportswear X-Change news: Ballybunion NKEF"
