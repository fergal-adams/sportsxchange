families_intro: "Post what you have, browse what's available, connect with other families."

clubs_text: "Want to bulk-contribute gear or promote Sportswear X-Change to your members? We can help you donate unused team kit, encourage participation, and set up a collection point at your club."

businesses_text: "Become a drop-off point. If you're a supermarket, community centre, or sports facility interested in hosting a collection point, we'd love to hear from you. Benefits include community goodwill, sustainability alignment, and visible community impact."

contact_note: "Follow NKEF on Facebook for sustainability updates and Sportswear X-Change news."
