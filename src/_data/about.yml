story:
  - "North Kerry has fantastic sports clubs and passionate young athletes. But sports can be expensive. Kids grow fast — kits that fit one year are too small the next. Good quality gear ends up in cupboards or landfills."
  - "Sportswear X-Change started with a simple idea: what if families could share? What if outgrown kit could find a new player instead of going to waste?"
  - "We're starting in North Kerry to prove this works. Our goal is to remove cost as a barrier to sport, reduce waste, and strengthen community."

cards:
  - icon: "👨‍👩‍👧"
    title: For families
    text: "Sport keeps kids healthy and happy. Cost shouldn't be a barrier."
  - icon: "🌱"
    title: For the environment
    text: "Every item in use is one less in landfill. Less waste, fewer emissions."
  - icon: "🤝"
    title: For community
    text: "Neighbours helping neighbours. The spirit of North Kerry sport."

sdg_text:
  - "Sportswear X-Change aligns with the UN's Sustainable Development Goal 12: Responsible Consumption and Production."
  - 'Instead of the traditional "make, use, throw away" cycle, we''re creating a circular model where items stay in use for as long as possible. This reduces waste, lowers carbon emissions, and uses resources more wisely.'

nkef_text:
  - "North Kerry Environmental Forum is a community group dedicated to environmental action and sustainability in North Kerry. We work on circular economy initiatives, community engagement, and practical solutions to reduce waste."
  - "For more on our sustainability work and SDG resources, visit our Facebook page."
